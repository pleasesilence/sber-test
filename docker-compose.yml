services:
  backend:
    container_name: ip-service
    restart: unless-stopped
    build:
      context: ./backend
      target: dev
    environment:
      IP_TTL: 60
    expose:
      - 8000
    volumes:
      - ./backend:/backend

  nginx:
    container_name: nginx
    restart: unless-stopped
    image: nginx:stable-alpine3.24
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started